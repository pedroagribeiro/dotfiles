# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Start Aerospace at login
start-at-login = false

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
  inner.horizontal = 10
  inner.vertical =   10
  outer.left =       10
  outer.bottom =     10
  outer.top =        10
  outer.right =      10

[mode.main.binding]
  # cmd-enter = 'exec-and-forget wezterm start'
  cmd-enter = 'exec-and-forget open -a Ghostty'
  # cmd-enter = 'exec-and-forget open -a WezTerm'


  # Shift the focus of the window
  # cmd-h = 'focus --boundaries-action wrap-around-the-workspace left'
  # cmd-j = 'focus --boundaries-action wrap-around-the-workspace down'
  # cmd-k = 'focus --boundaries-action wrap-around-the-workspace up'
  # cmd-l = 'focus --boundaries-action wrap-around-the-workspace right' (overrides the browser shortcut)

  cmd-left  = 'focus --boundaries-action wrap-around-the-workspace left'
  cmd-down  = 'focus --boundaries-action wrap-around-the-workspace down'
  cmd-up    = 'focus --boundaries-action wrap-around-the-workspace up'
  cmd-right = 'focus --boundaries-action wrap-around-the-workspace right'

  # Move windows in the workspace
  cmd-shift-h = 'move left'
  cmd-shift-j = 'move down'
  cmd-shift-k = 'move up'
  cmd-shift-l = 'move right'

  cmd-shift-left  = 'move left'
  cmd-shift-down  = 'move down'
  cmd-shift-up    = 'move up'
  cmd-shift-right = 'move right'

  # Consider using 'join-with' command as a 'split' replacement if you want to enable
  # normalizations
  alt-h = 'split horizontal'
  alt-v = 'split vertical'

  alt-s = 'layout v_accordion' # 'layout stacking' in i3
  alt-w = 'layout h_accordion' # 'layout tabbed' in i3
  alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

  alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

  # Switch to workspace $
  cmd-1 = 'workspace 1'
  cmd-2 = 'workspace 2'
  cmd-3 = 'workspace 3'
  cmd-4 = 'workspace 4'
  cmd-5 = 'workspace 5'
  cmd-6 = 'workspace 6'
  cmd-7 = 'workspace 7'
  cmd-8 = 'workspace 8'
  cmd-9 = 'workspace 9'
  cmd-0 = 'workspace 10'

  # Move focused window to workspace $
  cmd-shift-1 = 'move-node-to-workspace 1'
  cmd-shift-2 = 'move-node-to-workspace 2'
  cmd-shift-3 = 'move-node-to-workspace 3'
  cmd-shift-4 = 'move-node-to-workspace 4'
  cmd-shift-5 = 'move-node-to-workspace 5'
  cmd-shift-6 = 'move-node-to-workspace 6'
  cmd-shift-7 = 'move-node-to-workspace 7'
  cmd-shift-8 = 'move-node-to-workspace 8'
  cmd-shift-9 = 'move-node-to-workspace 9'
  cmd-shift-0 = 'move-node-to-workspace 10'

  # Force configuration reload
  cmd-shift-r = 'reload-config'

  # Modes toggling
  cmd-r = 'mode resize'

[mode.resize.binding]
  h     = 'resize width -50'
  j     = 'resize height +50'
  k     = 'resize height -50'
  l     = 'resize width +50'
  left  = 'resize width -50'
  up    = 'resize height +50'
  down  = 'resize height -50'
  right = 'resize width +50'

  enter = 'mode main' # as a confirmation
  esc   = 'mode main' # as an escape

# Assign workspaces to particular monitors
# use `aerospace list-monitors` to get monitors list
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
10 = 'secondary'

# Assign apps to particular workspaces
[[on-window-detected]]
  if.app-id = 'org.jkiss.dbeaver.core.product'
  run = 'move-node-to-workspace 1'

[[on-window-detected]]
  if.app-id = 'com.apple.finder'
  run = 'move-node-to-workspace 1'

[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = 'move-node-to-workspace 3'

[[on-window-detected]]
  if.app-id = 'com.google.Chrome'
  run = 'move-node-to-workspace 3'

[[on-window-detected]]
  if.app-id = 'com.tinyspeck.slackmacgap'
  run = 'move-node-to-workspace 4'

[[on-window-detected]]
  if.app-id = 'com.microsoft.VSCode'
  run = 'move-node-to-workspace 6'

[[on-window-detected]]
  if.app-id = 'dev.zed.Zed'
  run = 'move-node-to-workspace 6'

[[on-window-detected]]
  if.app-id = 'com.canva.affinity'
  run = 'move-node-to-workspace 7'

[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace 10'

[[on-window-detected]]
  if.app-id = 'com.mitchellh.ghostty'
  run = ['layout tiling']
